# the review api, and /private/ (private.js): `make review-deploy` from the
# repo root, and `make private-key` once for /private/'s read key. the
# access gates over both are .github/workflows/review.yml
name = "aerial-review"
main = "review.js"
compatibility_date = "2026-10-01"
workers_dev = true
routes = [
  { pattern = "aerial.datadesk.eco/review/api/*", zone_name = "datadesk.eco" },
  { pattern = "aerial.datadesk.eco/private/*", zone_name = "datadesk.eco" },
]

[[d1_databases]]
binding = "DB"
database_name = "flux-review"
database_id = "69e54c8e-9e23-4365-ba27-60058f6cde01"
