<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- the attribution review queue: every published claim no person has
         judged (`verified` null; the claims from before 2026-10-04 are
         `grandfathered`, and ?all brings them back), and every verdict given
         here, which can be changed or reopened. behind cloudflare access; a
         verdict goes to the review worker, and the jump host folds it into
         the table's `verified` within the quarter hour. -->
    <title>aerial / review</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 18.43 18.43%22%3E%3Cpath fill=%22%23fff%22 d=%22M13.8686%207.48339L15.2829%206.06903L18.4278%209.21392L15.283%2012.3588L13.8686%2010.9444L15.5991%209.21392L13.8686%207.48339ZM10.9438%2013.8692L12.3582%2015.2836L9.21392%2018.4278L6.06903%2015.2829L7.48335%2013.8686L9.21388%2015.5991L10.9438%2013.8692ZM4.55859%2010.9438L3.14427%2012.3582L0%209.2139L3.14427%206.06964L4.55861%207.48398L2.82867%209.21392L4.55859%2010.9438ZM7.48337%204.55922L6.06903%203.14488L9.2139%200L12.3582%203.14427L10.9438%204.55863L9.21388%202.82871L7.48337%204.55922Z%22/%3E%3C/svg%3E">
    <link rel="stylesheet" href="../vendor/fonts/inter.css">
    <link rel="stylesheet" href="../vendor/maplibre-gl.css">
    <link rel="stylesheet" href="../shell/shell.css">
    <link rel="stylesheet" href="../style.css">
    <style>
        /* one column: the queue is the panel, and each claim is reviewed where
           it sits in it. the claim at the top of the scroll is the map's */
        .rv { position: absolute; top: 0; left: 0; bottom: 0; width: 400px;
              margin: var(--dd-margin); display: flex;
              flex-direction: column; background: var(--dd-ui-background);
              border: 1px solid var(--dd-ui-border); }
        .rv > header { padding: var(--dd-padding-l) var(--dd-padding-l)
                       var(--dd-padding-s); display: flex;
                       flex-direction: column; gap: var(--dd-pair-gap); }
        .rv-head { display: flex; align-items: baseline;
                   justify-content: space-between; gap: var(--dd-pair-gap);
                   border-bottom: 1px solid var(--dd-ui-border);
                   padding-bottom: var(--dd-head-rule); }
        .rv-list, .rv-tx-body { scrollbar-width: thin;
            scrollbar-color: var(--dd-ui-inactive) transparent; }
        .rv-list { flex: 1; overflow-y: auto; padding: 0 30px 50vh; }
        .rv-item { padding: 25px 0;
                   display: flex; flex-direction: column; gap: 15px;
                   color: var(--dd-ui-text-secondary); }
        .rv-item.on { color: var(--dd-ui-text); cursor: default; }
        .rv-why { white-space: pre-wrap; overflow-wrap: anywhere; }
        .rv-ev { display: flex; flex-wrap: wrap; gap: 6px; }
        .rv-none { padding-top: var(--dd-gap-s); }
        .rv-stats { display: flex; flex-direction: column;
                    gap: var(--dd-info-gap); --dd-cols: auto 1fr; }
        .rv-stats dd-row > :last-child { text-align: right;
                                         overflow-wrap: anywhere; }
        .rv-notes { width: calc(100% + 14px); margin: 0 -7px; padding: 4px 6px;
                    background: none; color: inherit; font: inherit;
                    border: 1px solid var(--dd-ui-border); resize: vertical;
                    outline: none; }
        /* the queue's view: an order and two filters, in the tabs' idiom */
        .rv-view { display: flex; flex-wrap: wrap; align-items: center;
                   gap: 6px 15px; color: var(--dd-ui-text-secondary); }
        .rv-view label { display: flex; align-items: center; gap: 6px;
                         cursor: pointer; }
        .rv-view select { background: none; color: var(--dd-ui-text);
                          font: inherit; border: none; padding: 0;
                          cursor: pointer; outline: none; }
        .rv-view option { background: var(--dd-ui-background); }
        .rv-view input { appearance: none; margin: 0; width: 9px; height: 9px;
                         border: 1px solid var(--dd-ui-text-secondary);
                         cursor: pointer; }
        .rv-view input:checked { background: var(--dd-ui-text);
                                 border-color: var(--dd-ui-text); }
        .rv-view select { field-sizing: content; }
        .rv-conf { display: flex; gap: var(--dd-pair-gap); }
        .rv-c { background: none; border: none; cursor: pointer;
                color: var(--dd-ui-inactive); }
        .rv-c.on { color: var(--dd-ui-text); }
        .rv-item.done > :not(.rv-head) { display: none; }
        /* the agent's transcript, read when opened: its own scroll, so the
           list's does not move */
        .rv-tx summary { cursor: pointer; }
        .rv-tx-body { max-height: 60vh; overflow-y: auto; margin-top: 15px;
                      display: flex; flex-direction: column; gap: 11px;
                      white-space: pre-wrap; overflow-wrap: anywhere; }
        .rv-tx-body .rv-head { margin-top: var(--dd-padding-s); }
        .rv-tx-out, .rv-tx-think { color: var(--dd-ui-text-secondary); }
        .rv-tx-results a { display: block; }
        .rv-item.done { color: var(--dd-ui-inactive); }
        @media (max-width: 768px) {
            .rv { top: auto; right: 0; width: auto; height: 55vh; }
            .rv > header { padding: var(--dd-padding-s); }
            .rv-list { padding: 0 var(--dd-padding-s) 40vh; }
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <aside class="rv">
        <header>
            <div class="rv-head">Attribution review</div>
            <dd-toggle id="tabs" value="open"></dd-toggle>
            <form class="rv-view" id="view">
                <label>Order by <select name="order">
                    <option value="run">Run</option>
                    <option value="date">Plume date</option>
                    <option value="rate">Rate</option></select></label>
                <label><input type="checkbox" name="feat"> With features</label>
                <span class="rv-conf">Confidence
                <button type="button" class="rv-c on"
                    data-c="high">High</button>
                <button type="button" class="rv-c on"
                    data-c="medium">Medium</button>
                <button type="button" class="rv-c on"
                    data-c="low">Low</button></span>
            </form>
        </header>
        <div class="rv-list" id="list"></div>
    </aside>
    <script src="../vendor/maplibre-gl.js"></script>
    <script type="module" src="review.js"></script>
</body>
</html>
