name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# one deploy at a time: pages refuses a second while one syncs, and a slow
# sync (10 min on 2026-11-06) failed the push behind it. the newest waits
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      # the same script `make dist` runs, so what is verified locally is what
      # ships, assertions and all
      - run: bash scripts/dist.sh "$GITHUB_SHA"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
