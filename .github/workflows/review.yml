name: Review gate

# the cloudflare access applications over aerial.datadesk.eco/review and
# /private (the archive's private tables), gated by the shared "Data Desk"
# policy. wrangler's login cannot manage access, and
# the org token this reads can; it creates the application once and then
# finds it there.
on:
  push:
    branches: [main]
    paths: [.github/workflows/review.yml]
  workflow_dispatch:

jobs:
  access:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      API: https://api.cloudflare.com/client/v4/accounts/6bf7022757e7f54cfc2ad145de0632b7/access
    steps:
      - run: |
          cf() { curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' "$@"; }
          p=$(cf "$API/policies" |
            jq -r '.result[] | select(.name == "Data Desk") | .id')
          for n in review private; do d=aerial.datadesk.eco/$n
            if cf "$API/apps" | jq -e --arg d "$d" \
                'any(.result[]; .domain == $d)' >/dev/null; then
              echo "$d is gated"; continue
            fi
            cf -X POST "$API/apps" -d "$(jq -n --arg d "$d" --arg p "$p" \
              --arg n "aerial $n" '{name: $n, domain: $d, type: "self_hosted",
                session_duration: "168h",
                policies: [{id: $p, precedence: 1}]}')" >/dev/null
            echo "$d gated"
          done
